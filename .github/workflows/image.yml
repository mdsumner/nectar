# Build the recipe's container image (image/Dockerfile) and publish it as ghcr.io/mdsumner/nectar.
# Pull requests that touch the image only build it, as a check. Pushes to main, and a monthly run (to pick up a
# new GDAL release from gdal-system:latest), build and publish :latest plus a dated tag.
name: Image

on:
  push:
    branches: [main]
    paths: [image/**, recipes/layers/30-gdal.sh, recipes/layers/40-r.sh, recipes/layers/41-rstudio.sh, recipes/layers/42-rust.sh, recipes/layers/43-jupyter.sh, .github/workflows/image.yml]
  pull_request:
    paths: [image/**, recipes/layers/30-gdal.sh, recipes/layers/40-r.sh, recipes/layers/41-rstudio.sh, recipes/layers/42-rust.sh, recipes/layers/43-jupyter.sh, .github/workflows/image.yml]
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

concurrency: image-${{ github.ref }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the image is ~5 GB, built on top of a GDAL image of similar size: make room on the runner
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        run: echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/mdsumner/nectar:latest
            ghcr.io/mdsumner/nectar:${{ steps.date.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # the VM recipe's own final check: read a window of remote GEBCO through the image's GDAL
      - name: Check the image
        run: docker run --rm -v "$PWD/recipes/layers:/layers:ro" ghcr.io/mdsumner/nectar:latest bash /layers/70-check.sh
